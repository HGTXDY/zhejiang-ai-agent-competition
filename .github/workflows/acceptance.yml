name: M1 acceptance

on:
  pull_request:
    paths:
      - "contracts/v1/**"
      - "fixtures/v1/**"
      - "scripts/validate_contracts.py"
      - "tests/acceptance/**"
      - "backend/**"
      - ".github/workflows/acceptance.yml"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install 'jsonschema[format]>=4.23,<5' pytest -r backend/requirements.txt
      - name: Validate contracts and fixtures
        run: |
          python scripts/validate_contracts.py
          PYTHONPATH=. pytest -q tests/acceptance
