name: API tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/v1/**"
      - "fixtures/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: PYTHONPATH=backend:. python -m pytest -q backend/tests/test_api.py
