name: Multi-objective metrics tests

on:
  pull_request:
    paths:
      - "backend/app/metrics/**"
      - "backend/tests/test_multi_objective.py"
      - "docs/technical/MULTI_OBJECTIVE_OPTIMIZATION.md"
      - ".github/workflows/metrics.yml"

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run metric tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_multi_objective.py
