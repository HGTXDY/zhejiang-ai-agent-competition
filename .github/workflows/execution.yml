name: Execution state tests

on:
  pull_request:
    paths:
      - "backend/app/execution/**"
      - "backend/tests/test_state_machine.py"
      - "docs/technical/EXECUTION_STATE_MACHINE.md"
      - ".github/workflows/execution.yml"

jobs:
  execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run execution state tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_state_machine.py
