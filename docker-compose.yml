services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COOKFLOW_CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
